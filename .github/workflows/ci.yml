name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$(node -p "require('./package.json').engines.npm")"
      - run: npm ci
      - run: npm ci --prefix verification/group-chat-local
      - run: npm ci --prefix verification/issue35
      - run: npm run typecheck
      - run: npm run lint

  backend-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$(node -p "require('./package.json').engines.npm")"
      - run: npm ci
      - name: Run Offline tests
        timeout-minutes: 10
        run: npm test
        env:
          OFFLINE_TEST_REPORT: ${{ runner.temp }}/offline/report.json
      - name: Save Offline test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-offline
          path: ${{ runner.temp }}/offline/report.json
          if-no-files-found: error

  backend-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_TEST_REPORT: .runtime/backend-db/report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$(node -p "require('./package.json').engines.npm")"
      - name: Run isolated PostgreSQL tests
        timeout-minutes: 8
        run: npm run test:db
      - name: Ensure test container is removed
        if: always()
        timeout-minutes: 1
        run: node scripts/test-db.mjs --cleanup
      - name: Save DB test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-db
          path: ${{ env.DB_TEST_REPORT }}
          if-no-files-found: error
