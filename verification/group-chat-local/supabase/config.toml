# Dedicated local infrastructure only. Never link to a hosted project.
project_id = "imahima-chat-local"
[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[api.tls]
enabled = false
[db]
port = 56322
shadow_port = 56320
major_version = 17
health_timeout = "2m"
[db.pooler]
enabled = false
port = 56329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100
[db.migrations]
enabled = false
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = true
[studio]
enabled = false
port = 56323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = false
port = 56324
[storage]
enabled = false
[storage.s3_protocol]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:56331"
additional_redirect_urls = []
jwt_expiry = 3600
signing_keys_path = "../.runtime/signing_keys.json"
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 10
[auth.email]
enabled = true
enable_confirmations = false
[auth.sms]
enabled = false
[edge_runtime]
enabled = false
inspector_port = 56328
[analytics]
enabled = false
port = 56327
backend = "postgres"
